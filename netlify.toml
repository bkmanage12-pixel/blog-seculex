[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[functions]
  included_files = ["protected_documents/**"]

[build.environment]
  NODE_VERSION = "20"
  # ⚠️  SECURITY: ADMIN_PASSWORD_HASH and ADMIN_PASSWORD_SALT must be set
  #               ONLY via Netlify Dashboard → Site → Environment Variables.
  #               NEVER commit credential values here.

# 1. Base Admin Portal routing (serves /admin/index.html cleanly on app domain)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true

# 2. Redirect www.seculex.org to canonical apex seculex.org
[[redirects]]
  from = "https://www.seculex.org/*"
  to = "https://seculex.org/:splat"
  status = 301
  force = true

# 3. Explicit Admin Portal routing on Netlify app domains
[[redirects]]
  from = "https://publisherseculexp.netlify.app/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://publisherseculexp.netlify.app/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://seculexp.netlify.app/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://seculexp.netlify.app/admin"
  to = "/admin/index.html"
  status = 200
  force = true

# 4. Redirect remaining public pages from Netlify app domain to seculex.org
[[redirects]]
  from = "https://publisherseculexp.netlify.app/*"
  to = "https://seculex.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://seculexp.netlify.app/*"
  to = "https://seculex.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://seculexp.netlify.app/*"
  to = "https://seculex.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://seculex.netlify.app/*"
  to = "https://seculex.org/:splat"
  status = 301
  force = true

# ══════════════════════════════════════════════════════════════════
# HTTP SECURITY HEADERS
# ══════════════════════════════════════════════════════════════════

# 5. Global security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years and include subdomains
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Block site from being embedded in iframes (clickjacking protection)
    X-Frame-Options = "DENY"
    # Prevent browsers from MIME-sniffing responses
    X-Content-Type-Options = "nosniff"
    # Enable browser XSS filter (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Control referrer information leakage
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrict access to browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    # Content Security Policy — allows all required external resources + CMS dynamic template evaluation, image uploads & Git Gateway auth
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: blob: data:; media-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' https://identity.netlify.com https://*.netlify.app https://*.netlify.com; upgrade-insecure-requests;"

# 6. Stricter headers for the admin portal
[[headers]]
  for = "/admin/*"
  [headers.values]
    # Prevent all caching on admin pages
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    # Admin must never be indexed
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    # Admin frame origin protection
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: blob: data:; media-src 'self' data: blob: https:; frame-src 'self' https://identity.netlify.com https://*.netlify.app https://*.netlify.com; object-src 'none'; base-uri 'self';"

# 7. No caching on Netlify functions
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"
