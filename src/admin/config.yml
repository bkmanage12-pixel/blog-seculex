      - label: "Services & Retainers Pricing"
        name: "services"
        file: "src/_data/services.json"
        fields:
          - label: "Services Catalog"
            name: "services"
            widget: "list"
            fields:
              - {label: "Service ID (unique slug)", name: "id", widget: "string"}
              - {label: "Service Name", name: "name", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Badge Label", name: "badge", widget: "string", required: false}
              - {label: "FontAwesome Icon", name: "icon", widget: "string", default: "fa-scale-balanced"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Duration / Engagement Scope", name: "duration", widget: "string", required: false}
              - {label: "Is Custom Quote / Variable Amount", name: "is_custom", widget: "boolean", default: false}
              - label: "Standard Prices"
                name: "prices"
                widget: "object"
                fields:
                  - {label: "Price in RWF", name: "RWF", widget: "number", value_type: "int", default: 50000}
                  - {label: "Price in USD", name: "USD", widget: "number", value_type: "float", default: 40}
                  - {label: "Price in EUR", name: "EUR", widget: "number", value_type: "float", default: 38}
