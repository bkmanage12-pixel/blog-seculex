        fields:
          - {label: "Enable Paywall", name: "enabled", widget: "boolean", default: true, hint: "Turn the download paywall on or off globally"}
          - {label: "Default Download Price", name: "price", widget: "number", value_type: "float", min: 0.5, step: 0.01, default: 5, hint: "Default amount visitors must pay to download protected documents."}
          - {label: "Currency", name: "currency", widget: "string", default: "USD", hint: "Currency code e.g. USD, EUR, XAF"}
          - {label: "Payment Modal Message", name: "payment_note", widget: "text", hint: "Message shown to visitors in the payment popup"}
          - {label: "Modal Badge", name: "modal_badge", widget: "string"}
          - {label: "Modal Title", name: "modal_title", widget: "string"}
          - {label: "Per Document Label", name: "per_document_label", widget: "string"}
          - {label: "Paywall Close Button Label", name: "close_label", widget: "string", default: "Close"}
          - {label: "Verified Required Label", name: "verified_required_label", widget: "string"}
          - {label: "Redirect Hint", name: "redirect_hint", widget: "text"}
          - {label: "Secure Notice", name: "secure_notice", widget: "string"}
          - {label: "Checkout Loading Message", name: "checkout_loading_message", widget: "string"}
          - {label: "Checkout Error Message", name: "checkout_error_message", widget: "string"}
          - {label: "Verification Loading Message", name: "verification_loading_message", widget: "string"}
          - {label: "Verification Error Message", name: "verification_error_message", widget: "string"}
          - {label: "Verification Success Message", name: "verification_success_message", widget: "string"}
          - {label: "Download Again Label", name: "download_again_label", widget: "string"}
          - {label: "PayPal Button Label", name: "pay_now_paypal_label", widget: "string", default: "Pay with Cards", hint: "Text shown on the PayPal payment button inside the paywall modal."}
          - {label: "Mobile Money Button Label", name: "pay_now_flutterwave_label", widget: "string", default: "Pay with Mobile Money", hint: "Text shown on the Flutterwave / Mobile Money payment button inside the paywall modal."}

      - label: "Client Payment Portal Settings"
        name: "payment_settings"
        file: "src/_data/payment_settings.json"
        fields:
          - {label: "Company Legal Name", name: "company_name", widget: "string", default: "Forensic, Law-Tech Consulting Company Ltd"}
          - {label: "Brand Name", name: "brand_name", widget: "string", default: "SecuLex"}
          - {label: "Payment Page Title", name: "page_title", widget: "string", default: "Secure Client Payment Portal"}
          - {label: "Payment Page Tagline", name: "page_tagline", widget: "string", default: "Professional Consulting, Forensic Law & Legal-Tech Services"}
          - {label: "Payment Page Description", name: "page_description", widget: "text"}
          - {label: "Default Currency", name: "default_currency", widget: "select", options: ["RWF", "USD", "EUR"], default: "RWF"}
          - {label: "Pay Button Text", name: "pay_button_text", widget: "string", default: "Proceed to Secure Payment"}
          - {label: "Security Badge Text", name: "security_badge_text", widget: "string", default: "256-Bit SSL Encrypted & DPO-Ready Gateway"}
