<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecuLex Admin Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body>

    <!-- Floating Security Controls (shown when unlocked) -->
    <div id="admin-security-bar" style="display: none;">
      <span style="font-weight: 600; color: var(--admin-accent-gold);"><i class="fas fa-shield-halved"></i> SecuLex Admin</span>
      <button id="bar-btn-sync" class="admin-bar-btn admin-bar-btn-sync" title="Sync site changes"><i class="fas fa-rotate"></i> Sync Site</button>
      <button id="bar-btn-audit" class="admin-bar-btn" title="View Security Audit Logs"><i class="fas fa-list-check"></i> Security Log</button>
      <button id="bar-btn-change" class="admin-bar-btn" title="Change Admin Password"><i class="fas fa-key"></i> Change Password</button>
      <button id="bar-btn-lock" class="admin-bar-btn" title="Log Out"><i class="fas fa-sign-out-alt"></i> Log Out</button>
    </div>

    <!-- Toast Notification Container -->
    <div id="admin-toast-container"></div>

    <!-- ===================================================
         ADMIN SECURITY OVERLAY
         Single Login Gate only — NO registration, NO setup.
         Only one user can ever log in: the master admin.
    =================================================== -->
    <div id="admin-security-overlay">

      <!-- LOGIN GATE (the ONLY entry point) -->
      <div id="admin-view-login" class="admin-auth-card admin-auth-view" style="display: none;">
        <div class="admin-auth-header">
          <div class="admin-auth-icon"><i class="fas fa-lock"></i></div>
          <h1 class="admin-auth-title">SecuLex Admin</h1>
        </div>

        <div id="login-feedback" class="admin-feedback"></div>

        <form id="login-form">
          <div class="admin-form-group">
            <label class="admin-form-label" for="login-password">Password</label>
            <div class="admin-input-wrapper">
              <input type="password" id="login-password" class="admin-form-input" placeholder="Enter password..." required autocomplete="current-password" autofocus>
              <button type="button" class="admin-toggle-eye" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
            </div>
            <div id="login-caps-warning" class="admin-caps-warning"><i class="fas fa-exclamation-triangle"></i> Caps Lock is ON</div>
          </div>

          <button type="submit" class="admin-btn-primary"><i class="fas fa-right-to-bracket"></i> Log In</button>
        </form>

        <div class="admin-auth-footer" style="justify-content: center;">
          <span id="btn-goto-reset" class="admin-link"><i class="fas fa-key"></i> Forgot Password / Reset</span>
        </div>
      </div>

      <!-- PASSWORD RESET (Recovery Key or Email Code — no open registration) -->
      <div id="admin-view-reset" class="admin-auth-card admin-auth-view" style="display: none;">
        <div class="admin-auth-header">
          <div class="admin-auth-icon"><i class="fas fa-paper-plane"></i></div>
          <h1 class="admin-auth-title">Reset Password</h1>
          <p class="admin-auth-subtitle">Enter your Recovery Key, or request an email reset code.</p>
        </div>

        <div id="reset-feedback" class="admin-feedback"></div>

        <form id="reset-form">
          <div class="admin-form-group">
            <label class="admin-form-label" for="reset-email">Admin Email</label>
            <div style="display: flex; gap: 8px;">
              <input type="email" id="reset-email" class="admin-form-input" value="seculexpublications@gmail.com" readonly style="background: rgba(255,255,255,0.05); color: var(--admin-accent-gold); font-weight: 600;">
              <button type="button" id="btn-send-reset-code" class="admin-btn-secondary" style="white-space: nowrap; font-size: 0.8rem; padding: 0.75rem 0.9rem;"><i class="fas fa-paper-plane"></i> Send Email</button>
            </div>
          </div>

          <div class="admin-form-group">
            <label class="admin-form-label" for="reset-key">Recovery Key / Security Code</label>
            <input type="text" id="reset-key" class="admin-form-input" placeholder="Enter Recovery Key..." required style="font-family: monospace; letter-spacing: 1px;">
          </div>

          <div class="admin-form-group">
            <label class="admin-form-label" for="reset-new-password">New Password</label>
            <div class="admin-input-wrapper">
              <input type="password" id="reset-new-password" class="admin-form-input" placeholder="New password..." required autocomplete="new-password">
              <button type="button" class="admin-toggle-eye" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
            </div>
          </div>

          <div class="admin-form-group">
            <label class="admin-form-label" for="reset-confirm-password">Confirm Password</label>
            <div class="admin-input-wrapper">
              <input type="password" id="reset-confirm-password" class="admin-form-input" placeholder="Confirm password..." required autocomplete="new-password">
              <button type="button" class="admin-toggle-eye" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
            </div>
          </div>

          <button type="submit" class="admin-btn-primary"><i class="fas fa-rotate"></i> Reset & Save Password</button>
        </form>

        <div class="admin-auth-footer" style="justify-content: center;">
          <span id="btn-back-to-login" class="admin-link"><i class="fas fa-arrow-left"></i> Back to Login</span>
        </div>
      </div>

    </div>
    <!-- END ADMIN SECURITY OVERLAY -->

    <!-- Change Password Modal (inside CMS, for logged-in admin only) -->
    <div id="admin-change-modal" class="admin-modal-backdrop">
      <div class="admin-auth-card">
        <div class="admin-auth-header">
          <div class="admin-auth-icon"><i class="fas fa-key"></i></div>
          <h2 class="admin-auth-title">Change Password</h2>
        </div>

        <div id="change-feedback" class="admin-feedback"></div>

        <form id="change-password-form">
          <div class="admin-form-group">
            <label class="admin-form-label" for="change-current-password">Current Password</label>
            <div class="admin-input-wrapper">
              <input type="password" id="change-current-password" class="admin-form-input" placeholder="Current password..." required autocomplete="current-password">
              <button type="button" class="admin-toggle-eye" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
            </div>
          </div>

          <div class="admin-form-group">
            <label class="admin-form-label" for="change-new-password">New Password</label>
            <div class="admin-input-wrapper">
              <input type="password" id="change-new-password" class="admin-form-input" placeholder="New password..." required autocomplete="new-password">
              <button type="button" class="admin-toggle-eye" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
            </div>
          </div>

          <div class="admin-form-group">
            <label class="admin-form-label" for="change-confirm-password">Confirm New Password</label>
            <div class="admin-input-wrapper">
              <input type="password" id="change-confirm-password" class="admin-form-input" placeholder="Repeat new password..." required autocomplete="new-password">
              <button type="button" class="admin-toggle-eye" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
            </div>
          </div>

          <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
            <button type="button" id="modal-btn-close-change" class="admin-btn-secondary" style="flex: 1;">Cancel</button>
            <button type="submit" class="admin-btn-primary" style="flex: 2;"><i class="fas fa-save"></i> Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Security Audit Log Modal -->
    <div id="admin-audit-modal" class="admin-modal-backdrop">
      <div class="admin-auth-card" style="max-width: 580px;">
        <div class="admin-auth-header">
          <div class="admin-auth-icon"><i class="fas fa-shield-halved"></i></div>
          <h2 class="admin-auth-title">Security Audit Log</h2>
          <p class="admin-auth-subtitle">Access & authentication history</p>
        </div>

        <div class="admin-audit-table-wrapper">
          <table class="admin-audit-table">
            <thead>
              <tr>
                <th>Event</th>
                <th>Timestamp</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody id="audit-log-rows"></tbody>
          </table>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.2rem;">
          <button type="button" id="btn-clear-audit-logs" class="admin-btn-secondary" style="font-size: 0.76rem; padding: 0.4rem 0.8rem; color: var(--admin-text-secondary);"><i class="fas fa-trash-can"></i> Clear Logs</button>
          <button type="button" id="modal-btn-close-audit" class="admin-btn-secondary">Close</button>
        </div>
      </div>
    </div>

    <!-- Netlify CMS Engine -->
    <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>

    <!-- Admin Authentication Script -->
    <script src="/admin/admin-auth.js"></script>

    <script>
      if (typeof CMS !== "undefined") {
        CMS.registerPreviewStyle("/css/styles.css");
        if (CMS.registerEventListener) {
          CMS.registerEventListener({
            name: "postPublish",
            handler: function() {
              if (typeof handleSyncSite === "function") handleSyncSite();
            }
          });
          CMS.registerEventListener({
            name: "postUnpublish",
            handler: function() {
              if (typeof handleSyncSite === "function") handleSyncSite();
            }
          });
        }
      }
    </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </body>
</html>
